[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot AI - multi-tenant AI workforce platform with 25 specialist business agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.5.2",
    "email-validator==2.2.0",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.3",
    "redis==5.1.0",
    "celery==5.4.0",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.15.1",
    "bcrypt==4.2.0",
    "cryptography==50.0.2",
    "structlog==24.4.0",
    "python-multipart==0.0.32",
    "tenacity==9.0.0",
    "rapidfuzz==3.10.0",
    "python-dateutil==2.9.0.post0",
    "anthropic==1.15.0",
    "openai==1.109.1",
    "google-genai==2.31.0",
    "pgvector==0.3.4",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "prometheus-client==0.21.0",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.6.8",
    "bandit==1.7.10",
    "pip-audit==2.7.3",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "B904"]
